---
- name: Rotate IOS XE SNMP community via HashiCorp Vault
  hosts: all
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    vault_url: "{{ 'https://vault-fr2nm-1.apps.ocpv01.rhdp.net' }}"
    vault_role_id: "{{ '882a347a-1b08-246e-cd08-e5147fa65b97' }}"
    vault_secret_id: "{{ 'f5937059-f95e-6b2e-49df-ba854319e6fc' }}"
    vault_path: "aws_creds"
    snmp_acl_view: "RO SystemOwner"
    vault_auth: &vault_auth
      url: "{{ vault_url }}"
      auth_method: approle
      role_id: "{{ vault_role_id }}"
      secret_id: "{{ vault_secret_id }}"
      engine_mount_point: "secret"
      namespace: "root"
     
  tasks:
   - name: 1 | Pull current SNMP community from Vault KV v2 (AppRole)
     hashicorp.vault.kv2_secret_info:
       <<: *vault_auth
       path: "{{ vault_path }}"
       url: "{{ vault_url }}"
     register: vault_current
     delegate_to: localhost
     #no_log: true

   - name: 2 | Generate new random SNMP community
     ansible.builtin.set_fact:
       access_key: "{{ 'vault_current.access_key' }}"
       #new_community: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
     #no_log: true
